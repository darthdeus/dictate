[package]
name = "dictate"
version = "0.1.0"
edition = "2021"
description = "Hold-to-talk speech-to-text — local Whisper transcription with click-through overlay"
license = "MIT"

[[bin]]
name = "dictate"
path = "src/main.rs"

[lib]
name = "dictate_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
serde_json = "1"
# Streaming preview engine (Nemotron). Pinned: the bindings are pre-1.0.
# 6c24521 is the local-only `phrase-boost` branch (glossary phrase boosting,
# ParakeetStreamOptions::vocabulary_boost) in ~/projects/transcribe.cpp.
# Push it to a reachable remote and point `git` there before packaging.
transcribe-cpp = { git = "file:///home/darth/projects/transcribe.cpp", rev = "6c24521cb008be10adee292107004eea96a83c95", default-features = false, features = ["vulkan"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
