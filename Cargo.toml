[package]
name = "dictate"
version = "0.1.0"
edition = "2021"
description = "Hold-to-talk speech-to-text — local Whisper transcription with click-through overlay"
license = "MIT"

[[bin]]
name = "dictate"
path = "src/main.rs"

[lib]
name = "dictate_lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "1"
serde_json = "1"
# Streaming preview engine (Nemotron). Pinned: the bindings are pre-1.0.
transcribe-cpp = { git = "https://github.com/handy-computer/transcribe.cpp", rev = "db678a031cf4c524bcab2c45a0dc6a7813106e4a", default-features = false, features = ["vulkan"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
